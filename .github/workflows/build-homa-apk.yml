name: Homa APK
# Build against the pinned Homa-Commons source locally in CI.
#
# Homa-Commons remains the source of the Persian font system and Goodwy
# Commons integration. Publishing it to the runner's Maven cache avoids
# making the APK build depend on JitPack availability.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Homa
        uses: actions/checkout@v4

      - name: Checkout Homa-Commons
        uses: actions/checkout@v4
        with:
          repository: herotux/Homa-Commons
          ref: ef77dedcace3830b233dc2f6f75928380b4af51b
          path: homa-commons

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Publish Homa-Commons FOSS to Maven Local
        working-directory: homa-commons
        run: ./gradlew :commons:publishFossReleasePublicationToMavenLocal --stacktrace --no-daemon

      - name: Prepare local.properties
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          RIGHT_APP_KEY=
          PRODUCT_ID_X1=
          PRODUCT_ID_X2=
          PRODUCT_ID_X3=
          SUBSCRIPTION_ID_X1=
          SUBSCRIPTION_ID_X2=
          SUBSCRIPTION_ID_X3=
          SUBSCRIPTION_YEAR_ID_X1=
          SUBSCRIPTION_YEAR_ID_X2=
          SUBSCRIPTION_YEAR_ID_X3=
          EOF

      - name: Build FOSS debug APK
        run: ./gradlew :app:assembleFossDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Homa-FOSS-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
