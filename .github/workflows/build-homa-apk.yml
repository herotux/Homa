name: Homa APK
# Build against the pinned Homa-Commons source locally in CI.
#
# Homa-Commons remains the source of the Persian font system and Goodwy
# Commons integration. Publishing it to the runner's Maven cache avoids
# making the APK build depend on JitPack availability.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Homa
        uses: actions/checkout@v4

      - name: Checkout Homa-Commons
        uses: actions/checkout@v4
        with:
          repository: herotux/Homa-Commons
          ref: 23bb4a7bf685ffa61c8df815db6467cb926f071a
          path: homa-commons

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools for APK verification
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Publish Homa-Commons strings to Maven Local
        working-directory: homa-commons
        run: ./gradlew :strings:publishReleasePublicationToMavenLocal -PVERSION=23bb4a7bf685ffa61c8df815db6467cb926f071a --stacktrace --no-daemon

      - name: Publish Homa-Commons FOSS to Maven Local
        working-directory: homa-commons
        run: ./gradlew :commons:publishFossReleasePublicationToMavenLocal -PVERSION=23bb4a7bf685ffa61c8df815db6467cb926f071a --stacktrace --no-daemon

      - name: Prepare local.properties
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          RIGHT_APP_KEY=
          PRODUCT_ID_X1=
          PRODUCT_ID_X2=
          PRODUCT_ID_X3=
          SUBSCRIPTION_ID_X1=
          SUBSCRIPTION_ID_X2=
          SUBSCRIPTION_ID_X3=
          SUBSCRIPTION_YEAR_ID_X1=
          SUBSCRIPTION_YEAR_ID_X2=
          SUBSCRIPTION_YEAR_ID_X3=
          EOF

      - name: Build FOSS debug APK
        run: ./gradlew :app:assembleFossDebug --stacktrace --no-daemon

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/foss/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          echo "Checking APK: $APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          echo "APK signature and alignment checks passed."

      # Signature and ZIP alignment checks do not prove Android's package
      # manager can install the APK. Exercise the actual install path too.
      - name: Install APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -wipe-data
          disable-animations: true
          script: |
            set -euo pipefail
            APK="$(find app/build/outputs/apk/foss/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
            test -s "$APK"
            adb install "$APK"
            adb shell pm path com.goodwy.smsmessenger.debug
            echo "Android package manager installed the Homa FOSS debug APK successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Homa-FOSS-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
